config_version = "1.0"
configuration_status = "prepared-consumer-exact-only@1"

[memory]
enabled = true
api_version = "1.0"
project_id = "__PROJECT_ID__"
project_root = "."
default_memory_profile = "base@1"
deployment_profile = "local-embedded-no-cloud-key@1"
local_data_dir = ".sys4ai/memory"
read_only = false
strict_config = true

[memory.service]
transport = "in_process"
network_listener_enabled = false
bind_host = "127.0.0.1"
authentication_posture = "authenticated-network-only@1"
single_writer = true

[memory.provider]
name = "cognee"
version_constraint = "==1.5.3"
mode = "standalone"
initialize_on_load = false
allow_native_client_access = false
outbound_network = "deny"

[memory.provider.cognee]
dataset = "__DATASET_ID__"
backend_access_control_posture = "disabled-in-process-single-user@1"
accept_local_file_path = false

[memory.exact_index]
enabled = true
provider = "sqlite-fts5-canonical-reread-rg-diagnostic@1"
path = ".sys4ai/memory/exact_index/index.sqlite3"

[memory.models]
semantic_enabled = false
llm_profile = "pending-consumer-local-llm@1"
embedding_profile = "pending-consumer-local-embedding@1"
model_cache_dir = ".sys4ai/memory/models"
allow_remote = false
allow_cloud_fallback = false
profiles = []

[memory.registries]
sources = "registries/memory_source_registry.csv"
profiles = "registries/memory_profile_registry.csv"
relations = "registries/memory_relation_registry.csv"

[memory.sources]
respect_gitignore = true
default_include = false
require_registered_rule = true
require_discovery_dry_run = true

[memory.control_records]
root = "control_records/memory"
approval_policy_status = "pending-consumer-write-approval@1"
reviewer_principal_id = "__PRINCIPAL_ID__"
approvals_required = 1
self_approval_allowed = false
deny_unresolved_approval = true

[memory.permissions]
general_operations = ["health", "get", "recall", "explain", "sources_list", "sources_explain"]
privileged_operations = ["initialize", "sync"]
mutation_enabled = true
require_canonical_permission = true

[memory.security]
secret_scan = true
external_content_is_authority = false
allow_authority_inheritance = false
safe_path_mode = "project-allowlist"
allow_arbitrary_local_paths = false
require_dry_run_for_destructive = true
require_impact_preview = true
destructive_execution_enabled = false

[memory.retention]
policy_status = "approved-72h-365d-expiry-purge@1"
session_ttl_hours = 72
episodic_ttl_days = 365
session_persistence = false
episodic_persistence = false

[memory.export]
enabled = false
format_status = "approved-provider-neutral-zip-json-jsonl@1"
container = "zip"
encryption_required = true
encryption = "age-x25519"
recipient_reference_required = true
provider_native_export_enabled = false

[memory.shared]
enabled = false
backend_status = "disabled-no-approved-production-backend@1"
authentication_required = true
dataset_isolation_required = true

[memory.feedback]
automatic_collection = false
explicit_typed_only = true
policy_status = "approved-explicit-typed-only@1"

[memory.observability]
local_audit_log = ".sys4ai/memory/audit/events.jsonl"
content_logging = "metadata_only"
telemetry_export = false
