schema_version: "1.0"
api_version: "1.0"
profile_id: software-engineering@1
version: 1.0.0
extends:
  - base@1
compatibility:
  sys4ai_memory_api: ">=1.0,<2.0"
  required_capabilities:
    - source_registry
    - ingestion
    - exact
    - lexical
    - semantic
    - graph
    - provenance_explanation
record_types:
  - name: CodeSymbol
    schema_ref: schemas/memory/memory-record.schema.json
    exact_fields: [record_id, title, source.path, source.content_sha256]
    semantic_fields: [title, content.exact, content.summary]
    lexical_fields: [title, content.exact]
  - name: TestCase
    schema_ref: schemas/memory/memory-record.schema.json
    exact_fields: [record_id, title, source.path, source.content_sha256]
    semantic_fields: [title, content.exact, content.summary]
    lexical_fields: [title, content.exact]
  - name: BuildTarget
    schema_ref: schemas/memory/memory-record.schema.json
    exact_fields: [record_id, title, content.structured]
    semantic_fields: [title, content.exact]
    lexical_fields: [title, content.exact]
  - name: FailurePattern
    schema_ref: schemas/memory/memory-record.schema.json
    exact_fields: [record_id, title, content.structured]
    semantic_fields: [title, content.exact, content.summary]
    lexical_fields: [title, content.exact]
relations:
  - CALLS_CODE
  - TESTS_CODE
  - IMPORTS_MODULE
  - BUILDS_TARGET
source_adapters:
  - id: software-python-ast@1
    formats: [python]
write_policies:
  - ref: profiles/software-engineering/write-policy.md
    authority_tier: A3
retrieval_strategies:
  - ref: profiles/software-engineering/retrieval-rules.md
    authority_tier: A3
retention_policies:
  - ref: profiles/software-engineering/retention-policy.md
    authority_tier: A3
evaluations:
  - ref: profiles/software-engineering/evaluation.jsonl
