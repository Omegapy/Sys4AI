{
  "backend": {
    "enabled": true,
    "name": "basic-memory",
    "semantic_enabled": true
  },
  "canonical_root": "MEMORY",
  "contract_root": "reference-assets/MEMORY-depo",
  "corpus": {
    "exclude": [
      "Projects/**",
      "Tasks/**",
      "Roles/**",
      "roles/**",
      "sub-agent-roles/**",
      "**/*-depo/**",
      "reference-assets/**",
      ".git/**",
      ".venv*/**",
      "venv/**",
      ".sys4ai/**",
      ".agents/**",
      ".codex/**",
      "node_modules/**",
      "build/**",
      "dist/**",
      "target/**",
      "**/__pycache__/**",
      "**/.env*",
      "**/secrets/**",
      "**/credentials/**",
      "**/*.pem",
      "**/*.key"
    ],
    "include": [
      "README.md",
      "docs/**/*.md",
      "research/**/*.md",
      "research/**/*.tex",
      "research/**/*.pdf",
      "research/**/*.html"
    ],
    "source_groups": []
  },
  "integration": {
    "automatic_capture": false,
    "task_packets": true
  },
  "project": {
    "id": "triangular-checks",
    "name": "Triangular checks",
    "root": "."
  },
  "publication": {
    "director": null
  },
  "retrieval": {
    "max_results": 20,
    "mode": "auto"
  },
  "schema_version": 1,
  "state": {
    "backend_config": ".sys4ai/memory/backend-config",
    "index": ".sys4ai/memory/index",
    "maintenance": ".sys4ai/memory/maintenance",
    "model_cache": ".sys4ai/memory/model-cache",
    "normalized": ".sys4ai/memory/normalized",
    "projection": ".sys4ai/memory/projection"
  }
}
